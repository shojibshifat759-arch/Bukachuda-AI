name: Build Bukachuda AI APK

on:
  push:
    paths:
      - 'BukachudaAI_Android_Source.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract source
        run: |
          mkdir android-source
          unzip -o BukachudaAI_Android_Source.zip -d android-source
      - name: Build APK
        run: gradle -p android-source assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BukachudaAI-debug-apk
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
